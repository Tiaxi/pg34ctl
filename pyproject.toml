[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pg34ctl"
version = "0.1.0"
description = "Control the ASUS ROG Swift OLED PG34WCDN over DDC/CI on Linux and Windows"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["pyside6-essentials>=6.8,<7"]

[project.urls]
Repository = "https://github.com/Tiaxi/pg34ctl"

[project.scripts]
pg34ctl = "pg34ctl.cli:main"

[project.gui-scripts]
pg34ctl-gui = "pg34ctl.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pg34ctl"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
